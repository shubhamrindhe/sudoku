<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1.0" />

	<title>Sudoku</title>
	<link rel="stylesheet" href="../css/xhu.css" type="text/css" />

<body>

	<span id="SUDOKU_CONTAINER" class="centroid"></span>

	<script type="module">
		import Sudoku from './Sudoku.js';

			document.getElementById('SUDOKU_CONTAINER').appendChild(sudoku.board);
		}
	</script>
</body>
