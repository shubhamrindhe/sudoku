<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1.0" />
	<meta name="author" content="shubhamrindhe" id="author" />
	<title>Sudoku</title>
	<link rel="stylesheet" href="../css/xhu.css" type="text/css" />
	<link rel="stylesheet" href="./sudoku.css" type="text/css" />
</head>

<body>

	<span class="centroid">
		<span>0</span>
		<span id="SUDOKU_CONTAINER"></span>

		<button id="validate" type="button">Validate</button>
	</span>

	<script type="module">
		import Sudoku from './sudoku.js';

		onload = () => {
			let sudoku = new Sudoku();
			document.getElementById('SUDOKU_CONTAINER').appendChild(sudoku.board);
			sudoku.configure('284375196739816254651942378476128539312594687598637412143769825965283741827451963');
			document.getElementById('validate').onclick = _ => {
				let validationData = sudoku.validate();
				console.log(validationData);
				sudoku.showErrorsForCells(validationData.duplicate);
			};
		}
	</script>
</body>

</html>
